
name: Deploy Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PORTFOLIO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PORTFOLIO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/portfolio_deploy
          chmod 600 ~/.ssh/portfolio_deploy

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload production build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/portfolio_deploy -p 10028" \
            dist/ \
            administrator@173.208.151.121:/home/administrator/projects/portfolio/fahim-portfolio/dist/

      - name: Run deployment script
        run: |
          ssh \
            -i ~/.ssh/portfolio_deploy \
            -p 10028 \
            administrator@173.208.151.121 \
            'cd /home/administrator/projects/portfolio/fahim-portfolio && ./scripts/deploy.sh'

